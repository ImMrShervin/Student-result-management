services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: srms-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - PHP_IDE_CONFIG=serverName=srms
    depends_on:
      - mysql
      - redis
    networks:
      - srms

  nginx:
    image: nginx:1.27-alpine
    container_name: srms-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - srms

  mysql:
    image: mysql:8.0
    container_name: srms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: srms
      MYSQL_USER: srms
      MYSQL_PASSWORD: srms_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - srms-mysql-data:/var/lib/mysql
    networks:
      - srms

  redis:
    image: redis:7-alpine
    container_name: srms-redis
    ports:
      - "6380:6379"
    networks:
      - srms

  mailpit:
    image: axllent/mailpit:latest
    container_name: srms-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - srms

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: srms-horizon
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - srms

  frontend:
    image: node:20-alpine
    container_name: srms-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_PROXY_TARGET=http://nginx:80
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - srms

networks:
  srms:
    driver: bridge

volumes:
  srms-mysql-data:
